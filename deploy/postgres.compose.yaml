services:
  postgres:
    image: postgres:17-alpine
    env_file: /etc/benwa/postgres.env
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["/var/lib/benwa/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benwa -d benwa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
